<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        .error {
            color: red;
            font-size: 12px;
        }

        header {
            background-color: #47687c;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 6px;
        }

        body{
          background-color: #35424a;
        }
        
        form {
            text-align: center;
            margin-top: 20px;
        }

        input {
            width: 70%;
            padding: 10px;
            margin: 10px 0;
            border:none;
            border-radius: 6px;
        }
        
        button {
            padding: 10px 20px;
            color: rgb(236, 236, 255);
            background-color: rgba(0, 89, 255, 0.877);
            border-radius: 6px;
            border: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        button:hover{
          background-color: rgb(0, 0, 0);
        }

        .container{
            background-color:#030405;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 2px 10px white    ;
            width: 300px;
            height: 400px;
        }
    </style>
</head>
<body>
    <center><br><br><br><br><br>
    <div class="container">
    <header>
        <h1>Login to Your Account</h1>
    </header><br>
    <form id="loginForm">
        <input type="text" placeholder="Email" id="email" name="email" required><br>
        <span id="emailError" class="error"></span><br>

        <input type="password" placeholder="Password" id="password" name="password" required><br>
        <span id="passwordError" class="error"></span><br>

        <button type="submit">Login</button>
    </center>
    </form>
    </div>
    <script>
        function validateForm(event) {
            event.preventDefault();

            let isValid = true;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            emailError.textContent = '';
            passwordError.textContent = '';

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!email || !emailPattern.test(email)) {
                emailError.textContent = 'Please enter a valid email.';
                isValid = false;
            }

            if (!password || password.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters.';
                isValid = false;
            }

            if (isValid) {
                alert('Login successful!');
                window.location.href="VibeMart.html"
                // You can also perform an AJAX request to authenticate the user here
            }
        }

        document.getElementById('loginForm').addEventListener('submit', validateForm);
    </script>
</body>
</html>
